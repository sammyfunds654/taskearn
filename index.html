<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TokenRewards</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">TokenRewards</div>
  <button id="logoutBtn" class="secondary hidden">Log out</button>
</header>

<main>
<section id="authView" class="card">
  <h1>Earn. Complete tasks. Withdraw.</h1>
  <p class="muted">Create an account to start earning rewards.</p>
  <div class="tabs">
    <button id="loginTab" class="active">Log in</button>
    <button id="signupTab">Sign up</button>
  </div>

  <form id="authForm">
    <label>Email</label>
    <input id="email" type="email" required placeholder="you@example.com">
    <label>Password</label>
    <input id="password" type="password" minlength="6" required placeholder="At least 6 characters">
    <div id="phoneWrap" class="hidden">
      <label>Phone number</label>
      <input id="phone" type="tel" placeholder="+234...">
    </div>
    <button type="submit" class="primary" id="authSubmit">Log in</button>
    <p id="authMsg" class="message"></p>
  </form>
  <p class="tiny">Authentication is powered by Supabase after you add your project settings in <code>app.js</code>.</p>
</section>

<section id="appView" class="hidden">
  <div class="welcome card">
    <div><span class="muted">Welcome</span><h2 id="userEmail">User</h2></div>
    <div class="balance"><span>Balance</span><strong id="balance">0</strong> TOK</div>
  </div>

  <div class="grid">
    <div class="card">
      <h3>Available tasks</h3>
      <div id="tasks"></div>
    </div>
    <div class="card">
      <h3>Withdraw</h3>
      <p id="withdrawStatus" class="muted">Complete all required tasks before withdrawal becomes available.</p>
      <input id="wallet" placeholder="Wallet address">
      <button id="withdrawBtn" class="primary" disabled>Withdraw</button>
      <p id="withdrawMsg" class="message"></p>
    </div>
  </div>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
